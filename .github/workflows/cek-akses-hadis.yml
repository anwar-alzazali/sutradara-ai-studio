name: cek akses Quran Foundation hadis
# Pemeriksaan rahasia hanya boleh dijalankan manual oleh pemilik.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cek-scope-hadis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji scope content.hadith.read tanpa mencetak rahasia
        env:
          QURAN_FOUNDATION_CLIENT_ID: ${{ secrets.QURAN_FOUNDATION_CLIENT_ID }}
          QURAN_FOUNDATION_CLIENT_SECRET: ${{ secrets.QURAN_FOUNDATION_CLIENT_SECRET }}
        run: python -m sutradara.dalil.akses_hadis | tee -a "$GITHUB_STEP_SUMMARY"
