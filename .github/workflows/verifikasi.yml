name: verifikasi dalil
# Memakai rahasia Quran Foundation -> HANYA workflow_dispatch (lihat AGENTS.md).
on:
  workflow_dispatch:
    inputs:
      rencana:
        description: "Berkas rencana (pisahkan dengan spasi). Kosong = semua contoh/*.json"
        required: false
        default: ""
      simpan:
        description: "Commit hasil verifikasi ke cabang yang dijalankan"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: verifikasi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verifikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Cache dataset hadis
        uses: actions/cache@v4
        with:
          path: data/hadis
          key: hadis-${{ hashFiles('sutradara/dalil/unduh_hadis.py') }}
      - name: Unduh dataset hadis (bila belum ada di cache)
        run: test -f data/hadis/bukhari.json.gz || python -m sutradara.dalil.unduh_hadis
      - name: Verifikasi
        env:
          QURAN_FOUNDATION_CLIENT_ID: ${{ secrets.QURAN_FOUNDATION_CLIENT_ID }}
          QURAN_FOUNDATION_CLIENT_SECRET: ${{ secrets.QURAN_FOUNDATION_CLIENT_SECRET }}
          RENCANA: ${{ inputs.rencana }}
        run: |
          set -o pipefail
          berkas="${RENCANA:-$(ls contoh/*.json)}"
          status=0
          for f in $berkas; do
            echo "## $f" | tee -a "$GITHUB_STEP_SUMMARY"
            python -m sutradara verifikasi "$f" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
      - name: Simpan hasil
        if: ${{ always() && inputs.simpan }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add contoh/*.json ${{ inputs.rencana }}
          git diff --cached --quiet || (git commit -m "Verifikasi dalil (workflow #${{ github.run_number }})" && git push)
