name: uji
# Repo public: runner standar gratis. Tidak memakai rahasia apa pun, jadi aman dipicu push/PR.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: uji-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  tes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pasang dependensi
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-noto-core >/dev/null
      - name: Tes bot Telegram
        run: node --test bot/worker.test.mjs
      - name: Tes lengkap (tanpa render bukti)
        run: python -m pytest -q
      - name: Periksa final semua contoh
        run: |
          set -e
          for rencana in contoh/*.json; do
            echo "Periksa final: $rencana"
            python -m sutradara periksa "$rencana" --final
          done
      - name: Render bukti Nuh dengan narasi tiruan
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/render_bukti_nuh.py
      - name: Buat crop tanah 1:1 dari render Nuh untuk audit ponsel
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/crop_tanah_tahap_b.py keluaran-bukti/nuh/nuh_bisu.mp4 -o keluaran-bukti/nuh/crop-tanah-1x1.jpg
      - name: Ukur dampak tekstur tanah pada render Nuh dan Dabbah
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/benchmark_tekstur_tanah.py
      - name: Unggah laporan benchmark tekstur
        if: always() && github.head_ref != 'tahap-c-penguatan-dalil'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tekstur-tanah
          path: keluaran-bukti/tahap-b/benchmark-tekstur.json
          if-no-files-found: warn
      - name: Benchmark render serial dan paralel pada runner yang sama
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/benchmark_render_tahap_b.py
      - name: Render lembar kontak visual Tahap B
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/render_bukti_tahap_b.py
      - name: Render bukti visual Tahap B2
        if: github.head_ref != 'tahap-c-penguatan-dalil'
        run: python scripts/render_bukti_tahap_b2.py
      - name: Unggah bukti visual Tahap B2
        if: always() && github.head_ref != 'tahap-c-penguatan-dalil'
        uses: actions/upload-artifact@v4
        with:
          name: bukti-visual-tahap-b2
          path: keluaran-bukti/tahap-b2/
          if-no-files-found: warn
      - name: Render bukti kartu pasangan kata Tahap C
        if: github.head_ref == 'tahap-c-penguatan-dalil'
        run: python scripts/render_bukti_tahap_c.py
      - name: Unggah bukti visual kartu Tahap C
        if: always() && github.head_ref == 'tahap-c-penguatan-dalil'
        uses: actions/upload-artifact@v4
        with:
          name: bukti-visual-tahap-c
          path: keluaran-bukti/tahap-c/kartu-pasangan-kata.jpg
          if-no-files-found: error
      - name: Cache dataset hadis untuk verifikasi contoh Ya'juj
        uses: actions/cache@v4
        with:
          path: data/hadis
          key: hadis-${{ hashFiles('sutradara/dalil/unduh_hadis.py') }}
      - name: Verifikasi dalil contoh Ya'juj (API publik dan dataset)
        run: |
          set -e
          test -f data/hadis/bukhari.json.gz || python -m sutradara.dalil.unduh_hadis
          python -m sutradara verifikasi contoh/yajuj_majjuj.json
          python -m sutradara periksa contoh/yajuj_majjuj.json --final
          mkdir -p keluaran-bukti/verifikasi
          cp contoh/yajuj_majjuj.json keluaran-bukti/verifikasi/yajuj_majjuj.json
          git checkout -- contoh/yajuj_majjuj.json  # hasil verifikasi CI hanya bukti, jangan kotori pohon kerja
      - name: Unggah hasil verifikasi dalil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifikasi-dalil-yajuj
          path: keluaran-bukti/verifikasi/yajuj_majjuj.json
          if-no-files-found: warn
      - name: Unggah artefak render Nuh
        if: always() && github.head_ref != 'tahap-c-penguatan-dalil'
        uses: actions/upload-artifact@v4
        with:
          name: bukti-render-nuh-tahap-a
          path: keluaran-bukti/nuh/
          if-no-files-found: warn
      - name: Simpan bukti JPG hanya ke cabang bukti
        if: success() && github.head_ref != 'tahap-c-penguatan-dalil'
        run: |
          set -e
          mkdir -p /tmp/tahap-b-bukti /tmp/tahap-b-bukti-b2 /tmp/tahap-c-bukti
          cp keluaran-bukti/tahap-b/*.jpg /tmp/tahap-b-bukti/
          cp keluaran-bukti/tahap-b2/*.jpg /tmp/tahap-b-bukti-b2/
          if [ -f keluaran-bukti/tahap-c/kartu-pasangan-kata.jpg ]; then
            cp keluaran-bukti/tahap-c/kartu-pasangan-kata.jpg /tmp/tahap-c-bukti/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bukti >/dev/null 2>&1; then
            git fetch origin bukti
            git checkout -B bukti origin/bukti
          else
            git checkout --orphan bukti
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p tahap-b tahap-b2
          for file in /tmp/tahap-b-bukti-b2/*.jpg; do
            nama=$(basename "$file" .jpg)
            cp "$file" "tahap-b2/${nama}-${GITHUB_SHA}.jpg"
          done
          for file in /tmp/tahap-b-bukti/*.jpg; do
            nama=$(basename "$file" .jpg)
            cp "$file" "tahap-b/${nama}-${GITHUB_SHA}.jpg"
          done
          git add tahap-b tahap-b2
          git commit -m "Bukti visual Tahap B ${GITHUB_SHA}"
          git push origin HEAD:bukti

      - name: Simpan bukti Tahap C ke cabang terpisah
        if: success() && github.head_ref == 'tahap-c-penguatan-dalil'
        run: |
          set -e
          mkdir -p /tmp/tahap-c-bukti
          cp keluaran-bukti/tahap-c/kartu-pasangan-kata.jpg /tmp/tahap-c-bukti/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch bukti sudah ada; Git tidak mengizinkan ref bukti dan bukti/tahap-c bersamaan.
          # Pertahankan branch lama agar tautan bukti Tahap B/B2 tidak putus.
          if git ls-remote --exit-code --heads origin 'bukti-tahap-c' >/dev/null 2>&1; then
            git fetch origin 'refs/heads/bukti-tahap-c:refs/remotes/origin/bukti-tahap-c'
            git checkout -B bukti-tahap-c origin/bukti-tahap-c
          else
            git checkout --orphan bukti-tahap-c
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p tahap-c
          cp /tmp/tahap-c-bukti/kartu-pasangan-kata.jpg tahap-c/
          git add tahap-c/kartu-pasangan-kata.jpg
          if git diff --cached --quiet; then
            echo "Bukti Tahap C tidak berubah."
            exit 0
          fi
          git commit -m "Bukti visual Tahap C ${GITHUB_SHA}"
          git push origin HEAD:bukti-tahap-c
