name: Rekam efek suara
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buat-efek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buat efek yang belum ada
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("Secret ELEVENLABS_API_KEY belum diatur.")
          daftar = json.loads(pathlib.Path("aset/suara/prompt_efek.json").read_text(encoding="utf-8"))
          for item in daftar:
              tujuan = pathlib.PurePosixPath(item["berkas"])
              durasi = float(item["durasi"])
              if tujuan.is_absolute() or ".." in tujuan.parts or tujuan.parts[:3] != ("aset", "suara", "aksi") or tujuan.suffix != ".mp3":
                  raise ValueError(f"Lokasi target tidak diizinkan: {tujuan}")
              if not 0.5 <= durasi <= 22:
                  raise ValueError(f"Durasi di luar batas ElevenLabs: {durasi}")
              path = pathlib.Path(tujuan)
              if path.exists():
                  print(f"Lewati (sudah ada): {path}")
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              payload = json.dumps({
                  "text": item["prompt"],
                  "duration_seconds": durasi,
                  "prompt_influence": 0.35,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.elevenlabs.io/v1/sound-generation",
                  data=payload,
                  headers={
                      "xi-api-key": key,
                      "Content-Type": "application/json",
                      "Accept": "audio/mpeg",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  audio = response.read()
              mp3 = audio.startswith(b"ID3") or (
                  len(audio) > 2 and audio[0] == 0xff and audio[1] & 0xe0 == 0xe0
              )
              if not mp3:
                  raise RuntimeError(f"Respons bukan MP3 untuk {path}")
              path.write_bytes(audio)
              print(f"Dibuat: {path}")
          PY
      - name: Commit rekaman baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aset/suara/aksi
          if git diff --cached --quiet; then
            echo "Tidak ada rekaman baru."
            exit 0
          fi
          git commit -m "Tambahkan rekaman efek suara diegetik"
          git push origin "HEAD:${GITHUB_REF_NAME}"
