name: suara (narasi ElevenLabs)
# Mode narasi biasa memakai ELEVENLABS_API_KEY; mode uji_d2 hanya memakai cache yang sudah ada.
# Rahasia tetap hanya pada workflow_dispatch; mode D2 tidak memanggil API berbayar.
on:
  workflow_dispatch:
    inputs:
      rencana:
        description: "Berkas rencana (mis. contoh/nuh_mengejek.json); ketik uji_d2 untuk uji audio D2 tanpa biaya"
        required: true
permissions:
  contents: write
concurrency:
  group: suara
  cancel-in-progress: false
jobs:
  narasi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        env:
          RENCANA: ${{ inputs.rencana }}
        run: |
          pip install -r requirements.txt
          if [ "$RENCANA" = "uji_d2" ]; then
            python -m playwright install --with-deps chromium
            sudo apt-get install -y ffmpeg fonts-noto-core >/dev/null
          fi
      - name: Ambil cache audio untuk uji D2
        if: inputs.rencana == 'uji_d2'
        run: |
          git fetch --no-tags --depth=1 origin suara
          git checkout FETCH_HEAD -- data/suara
          mkdir -p keluaran-bukti/tahap-d2/cache-suara-elevenlabs
          cp -a data/suara/. keluaran-bukti/tahap-d2/cache-suara-elevenlabs/
      - name: Verifikasi alignment nyata dan render video D2
        if: inputs.rencana == 'uji_d2'
        run: python scripts/uji_audio_nyata_d2.py
      - name: Unggah bukti audio dan video D2
        if: always() && inputs.rencana == 'uji_d2'
        uses: actions/upload-artifact@v4
        with:
          name: bukti-audio-elevenlabs-d2
          path: keluaran-bukti/tahap-d2/audio-elevenlabs/
          if-no-files-found: warn
      - name: Ambil narasi yang sudah ada (cache cabang suara)
        if: ${{ inputs.rencana != 'uji_d2' }}
        run: |
          if git fetch --depth=1 origin suara; then git checkout FETCH_HEAD -- data/suara || true; fi
      - name: Cek naskah (gratis, sebelum membayar)
        if: ${{ inputs.rencana != 'uji_d2' }}
        env:
          RENCANA: ${{ inputs.rencana }}
        run: |
          read -r -a berkas_rencana <<< "$RENCANA"
          if [ "${#berkas_rencana[@]}" -eq 0 ]; then echo "Input rencana kosong" >&2; exit 1; fi
          for f in "${berkas_rencana[@]}"; do python -m sutradara naskah "$f"; done
      - name: Buat narasi
        if: ${{ inputs.rencana != 'uji_d2' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          RENCANA: ${{ inputs.rencana }}
        run: |
          set -euo pipefail
          read -r -a berkas_rencana <<< "$RENCANA"
          if [ "${#berkas_rencana[@]}" -eq 0 ]; then echo "Input rencana kosong" >&2; exit 1; fi
          python -m sutradara suara "${berkas_rencana[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Simpan ke cabang suara
        if: ${{ inputs.rencana != 'uji_d2' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/hasil && cp -r data/suara/. /tmp/hasil/
          if git fetch --depth=1 origin suara; then git checkout -B suara FETCH_HEAD; else git checkout --orphan suara && git rm -rqf .; fi
          mkdir -p data/suara && cp -r /tmp/hasil/. data/suara/
          git add -f data/suara
          git diff --cached --quiet || (git commit -m "Narasi (workflow #${{ github.run_number }})" && git push origin suara)
