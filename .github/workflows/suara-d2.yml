name: suara-d2
# Memakai audio ElevenLabs yang sudah dibuat dan disimpan pemilik di cabang suara.
# Tidak memanggil API berbayar dan tidak membutuhkan secret.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-noto-core >/dev/null
      - name: Ambil cache audio ElevenLabs yang sudah ada
        run: |
          git fetch --no-tags --depth=1 origin suara
          git checkout FETCH_HEAD -- data/suara
          mkdir -p keluaran-bukti/tahap-d2/cache-suara-elevenlabs
          cp -a data/suara/. keluaran-bukti/tahap-d2/cache-suara-elevenlabs/
      - name: Verifikasi alignment nyata dan render video D2
        run: python scripts/uji_audio_nyata_d2.py
      - name: Unggah bukti audio dan video D2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-audio-elevenlabs-d2
          path: keluaran-bukti/tahap-d2/audio-elevenlabs/
          if-no-files-found: warn
