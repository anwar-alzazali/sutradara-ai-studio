name: suara-d2
# API berbayar hanya dijalankan atas permintaan pemilik; tidak ada trigger push/PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-noto-core >/dev/null
      - name: Buat narasi ElevenLabs, periksa alignment, dan render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/uji_audio_nyata_d2.py
      - name: Unggah bukti audio dan video D2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-audio-elevenlabs-d2
          path: keluaran-bukti/tahap-d2/audio-elevenlabs/
          if-no-files-found: warn
