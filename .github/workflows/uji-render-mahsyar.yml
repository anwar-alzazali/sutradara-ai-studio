name: uji-render-mahsyar
on:
  push:
    branches:
      - uji/mahsyar-bangkit
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi render
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Cache dataset hadis
        uses: actions/cache@v4
        with:
          path: data/hadis
          key: hadis-${{ hashFiles('sutradara/dalil/unduh_hadis.py') }}
      - name: Unduh dataset hadis
        run: test -f data/hadis/bukhari.json.gz || python -m sutradara.dalil.unduh_hadis
      - name: Verifikasi dalil dengan pemeriksa resmi
        env:
          QURAN_FOUNDATION_CLIENT_ID: ${{ vars.QURAN_FOUNDATION_CLIENT_ID }}
          QURAN_FOUNDATION_CLIENT_SECRET: ${{ secrets.QURAN_FOUNDATION_CLIENT_SECRET }}
        run: python -m sutradara verifikasi contoh/mahsyar1_uji_bangkit.json
      - name: Periksa rencana uji
        run: python -m sutradara periksa contoh/mahsyar1_uji_bangkit.json --final
      - name: Render adegan uji
        run: |
          mkdir -p keluaran/mahsyar1-uji
          python -m sutradara video contoh/mahsyar1_uji_bangkit.json -o keluaran/mahsyar1-uji/mahsyar1-bangkit-uji.mp4 --fps 24 --lembar
      - name: Unggah video dan lembar kontak
        uses: actions/upload-artifact@v4
        with:
          name: mahsyar1-bangkit-uji
          path: |
            keluaran/mahsyar1-uji/mahsyar1-bangkit-uji.mp4
            keluaran/mahsyar1-uji/mahsyar1-bangkit-uji.jpg
          if-no-files-found: error
