name: naskah (antrean bot)
# Dipicu bot Telegram lewat API (workflow_dispatch). Memakai rahasia -> HANYA workflow_dispatch (lihat AGENTS.md).
# ide/tempel/revisi -> naskah terstruktur (Claude) -> verifikasi dalil -> kartu status + naskah dikirim ke Telegram.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "id antrean (folder antrean/<id>)"
        required: true
      mode:
        description: "ide | tempel | revisi"
        required: true
permissions:
  contents: write
concurrency:
  group: naskah-${{ inputs.id }}
  cancel-in-progress: false
jobs:
  naskah:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - name: Cache dataset hadis
        uses: actions/cache@v4
        with:
          path: data/hadis
          key: hadis-${{ hashFiles('sutradara/dalil/unduh_hadis.py') }}
      - name: Unduh dataset hadis (bila belum ada di cache)
        run: test -f data/hadis/bukhari.json.gz || python -m sutradara.dalil.unduh_hadis
      - name: Proses naskah
        env:
          ID: ${{ inputs.id }}
          MODE: ${{ inputs.mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QURAN_FOUNDATION_CLIENT_ID: ${{ secrets.QURAN_FOUNDATION_CLIENT_ID }}
          QURAN_FOUNDATION_CLIENT_SECRET: ${{ secrets.QURAN_FOUNDATION_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "$MODE" in ide|tempel|revisi) ;; *) echo "mode tidak sah"; exit 1;; esac
          [[ "$ID" =~ ^[a-z0-9_-]{1,60}$ ]] || { echo "id tidak sah"; exit 1; }
          python -m sutradara.antrean "$ID" "$MODE" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Simpan hasil
        env:
          ID: ${{ inputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "antrean/$ID"
          git diff --cached --quiet && exit 0
          git commit -m "Antrean $ID: naskah diproses (workflow #${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
